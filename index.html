<!doctype html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pravopis.io — Editor</title>
<meta name="description" content="Pravopis.io — hrvatski partner u pisanju." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--paper-50:#fafafa;--paper-100:#f0f0f0;--ink:#0a0a0a;--muted:#8c8c8c;--ui:#4d4d4d;--red:#0a0a0a;--red-bg:rgba(0,0,0,.07);--blue:#454545;--blue-bg:rgba(0,0,0,.055);--amber:#7a7a7a;--amber-bg:rgba(0,0,0,.04);--green:#0a0a0a;--green-bg:#f0f0f0;--line:rgba(0,0,0,.14);--shadow:0 1px 0 rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper-50);color:var(--ink)}body{font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-columns:64px minmax(0,1fr) 360px;grid-template-rows:64px 1fr;overflow:hidden}.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--paper);border-bottom:1px solid var(--line);z-index:2}.brand{display:flex;align-items:center;gap:10px;width:190px}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 16px 'Source Serif 4'}.brand-name{font-weight:700;letter-spacing:-.02em}.brand-name span{color:var(--red)}.title{border:0;background:transparent;font-size:15px;font-weight:500;padding:8px 10px;min-width:180px}.title:hover{background:var(--paper-50)}.spacer{flex:1}.goal{border:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--ui);background:var(--paper)}.save{font:12px 'Fragment Mono';color:var(--green);display:flex;align-items:center;gap:7px}.save:before{content:'';width:7px;height:7px;background:var(--green);border-radius:50%}.score{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ui)}.score-ring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 87%,var(--paper-100) 0);font:11px 'Fragment Mono'}.score-ring i{font-style:normal;background:var(--paper);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.nav{grid-row:2;padding:18px 0;background:var(--paper-50);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}.nav button{width:42px;height:42px;color:var(--muted);font-size:18px;border-radius:6px}.nav button.active,.nav button:hover{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}.nav .bottom{margin-top:auto}
.editor-wrap{grid-row:2;overflow:auto;background:var(--paper)}.page{max-width:800px;margin:0 auto;padding:72px 72px 160px}.eyebrow{font:11px 'Fragment Mono';letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:26px}.editor{font:400 20px/1.78 'Source Serif 4',serif;letter-spacing:-.005em;min-height:500px;white-space:pre-wrap;word-break:break-word;caret-color:var(--red)}.editor:empty:before{content:attr(data-placeholder);color:var(--muted);font-style:italic}.editor mark{color:inherit;background:transparent;border-bottom:2px solid;cursor:pointer;padding-bottom:2px}.editor mark.spelling{border-color:var(--red);background:var(--red-bg)}.editor mark.grammar{border-color:var(--blue);background:var(--blue-bg)}.editor mark.style{border-color:var(--amber);background:var(--amber-bg)}.toolbar{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:18px;margin-top:44px}.toolbar button{font-size:12px;color:var(--ui);padding:7px 10px;border-radius:4px}.toolbar button:hover{background:var(--paper-50)}
.panel{grid-row:2;display:flex;flex-direction:column;background:var(--paper);border-left:1px solid var(--line);min-width:0}.panel-head{padding:24px 20px 0}.panel-title{display:flex;align-items:baseline;gap:8px}.panel-title h2{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.08em}.panel-title span{font-size:12px;color:var(--muted)}.filters{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line)}.filter{padding:10px 7px 12px;font-size:11px;color:var(--ui);border-bottom:2px solid transparent}.filter.active{border-color:var(--ink);color:var(--ink);font-weight:600}.filter b{font:11px 'Fragment Mono';margin-left:3px}.panel-actions{display:flex;gap:8px;padding:14px 20px 0}.primary,.secondary{padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-radius:4px}.primary{background:var(--ink);color:var(--paper)}.secondary{border:1px solid var(--line);color:var(--ui)}.primary:hover{background:#39362f}.secondary:hover{border-color:var(--muted)}.suggestions{overflow:auto;padding:14px 20px 30px;display:flex;flex-direction:column;gap:9px}.card{border:1px solid var(--line);background:var(--paper);border-radius:6px;overflow:hidden}.card.selected{box-shadow:0 0 0 2px var(--blue)}.card-main{display:flex;gap:10px;padding:13px;cursor:pointer}.stripe{width:3px;border-radius:4px;background:var(--red);flex:none}.card.grammar .stripe{background:var(--blue)}.card.style .stripe{background:var(--amber)}.card-copy{min-width:0;flex:1}.category{font:10px 'Fragment Mono';color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.change{font:15px 'Source Serif 4';margin-bottom:5px}.old{text-decoration:line-through;color:var(--muted)}.new{font-weight:600}.explanation{font-size:12px;color:var(--ui);line-height:1.45}.card-actions{display:flex;gap:8px;padding:0 13px 13px 26px}.card-actions button{font:11px 'Fragment Mono';text-transform:uppercase;letter-spacing:.04em;padding:6px 9px;border-radius:4px}.accept{background:var(--green-bg);color:var(--green)}.ignore{color:var(--ui);border:1px solid var(--line)}.empty{padding:42px 20px;text-align:center;color:var(--ui);font:italic 15px/1.6 'Source Serif 4'}.empty strong{display:block;font:600 13px 'Instrument Sans';margin-bottom:8px;color:var(--ink)}
.status{position:fixed;bottom:0;left:64px;right:360px;background:var(--paper);border-top:1px solid var(--line);height:42px;display:flex;align-items:center;gap:20px;padding:0 24px;font:11px 'Fragment Mono';color:var(--ui);z-index:3}.status .counts{display:flex;gap:12px}.dot{display:inline-flex;align-items:center;gap:5px}.dot:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red)}.dot.blue:before{background:var(--blue)}.dot.amber:before{background:var(--amber)}.status .status-save{margin-left:auto;color:var(--green)}
.toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:5px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.app{grid-template-columns:52px minmax(0,1fr);grid-template-rows:58px 1fr}.topbar{padding:0 14px;gap:10px}.brand{width:auto}.brand-name,.goal,.score{display:none}.panel{display:none}.page{padding:42px 28px 100px}.status{left:52px;right:0}.save{margin-left:auto}.save span{display:none}}
@media(max-width:600px){.title{min-width:0;max-width:170px}.page{padding:30px 20px 90px}.editor{font-size:18px}.toolbar{margin-top:28px}.status{gap:8px;padding:0 12px;font-size:10px}.status .counts{gap:7px}.status .status-save{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">P</div><div class="brand-name">pravopis<span>.io</span></div></div><input class="title" id="title" value="Novi dokument" aria-label="Naslov dokumenta"><div class="spacer"></div><select class="goal" id="goal" aria-label="Cilj teksta"><option>Opće pisanje</option><option>Poslovni e-mail</option><option>Akademski rad</option><option>Službeni dopis</option></select><div class="score"><div class="score-ring"><i>87</i></div><span>Ocjena</span></div><div class="save" id="save"><span>Autosave uključen</span></div></header>
<nav class="nav" aria-label="Glavna navigacija"><button class="active" title="Editor">✎</button><button title="Moji dokumenti">▤</button><button title="Osobni rječnik">Aa</button><div class="bottom"><button title="Postavke">⚙</button></div></nav>
<main class="editor-wrap"><article class="page"><div class="eyebrow">Radni prostor / hrvatski</div><div id="editor" class="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Počnite pisati…">Ovo je moj prvi dokument u Pravopis.io. Neznam kako da ga najbolje započnem, ali želim pisati jasno i prirodno.</div><div class="toolbar" aria-label="Alatna traka"><button data-command="bold"><b>B</b></button><button data-command="italic"><i>I</i></button><button id="undo">↶ Poništi</button><button id="redo">↷ Ponovi</button><button id="clear">Očisti prijedloge</button></div></article></main>
<aside class="panel"><div class="panel-head"><div class="panel-title"><h2>Prijedlozi</h2><span id="count">3</span></div><div class="filters"><button class="filter active" data-filter="all">Sve <b>3</b></button><button class="filter" data-filter="spelling">Pravopis <b>1</b></button><button class="filter" data-filter="grammar">Gramatika <b>1</b></button><button class="filter" data-filter="style">Stil <b>1</b></button></div></div><div class="panel-actions"><button class="primary" id="accept-spelling">Prihvati pravopis</button><button class="secondary" id="analyze">Analiziraj</button></div><div class="suggestions" id="suggestions"></div></aside>
<div class="status"><span id="words">0 riječi</span><span id="chars">0 znakova</span><div class="counts"><span class="dot" id="spell-count">1</span><span class="dot blue" id="grammar-count">1</span><span class="dot amber" id="style-count">1</span></div><span class="status-save" id="status-save">Sve spremljeno</span></div>
</div><div class="toast" id="toast" role="status"></div>
<script>
const editor=document.getElementById('editor'), suggestions=document.getElementById('suggestions'), toast=document.getElementById('toast');
const issueRules=[{id:'ne-znam',category:'spelling',label:'Pravopis',wrong:'Neznam',right:'Ne znam',explanation:'Niječnica »ne« piše se odvojeno od glagola.'},{id:'da-ga',category:'grammar',label:'Gramatika',wrong:'kako da ga najbolje započnem',right:'kako ga najbolje započeti',explanation:'Infinitiv ovdje čini rečenicu kraćom i prirodnijom.'},{id:'prirodno',category:'style',label:'Stil i jasnoća',wrong:'jasno i prirodno',right:'jasno',explanation:'Kraća formulacija prenosi istu poruku izravnije.'}];
let dismissed=new Set(), accepted=new Set(), activeFilter='all';
function plain(){return editor.innerText.replace(/\n+/g,' ').trim()}
function stats(){const text=plain();const words=text?text.split(/\s+/).length:0;document.getElementById('words').textContent=words+' '+(words===1?'riječ':'riječi');document.getElementById('chars').textContent=text.length+' znakova'}
function render(){const text=plain();const visible=issueRules.filter(i=>!dismissed.has(i.id)&&!accepted.has(i.id));const filtered=visible.filter(i=>activeFilter==='all'||i.category===activeFilter);document.getElementById('count').textContent=visible.length;suggestions.innerHTML=filtered.length?filtered.map(i=>`<div class="card ${i.category}" data-id="${i.id}"><div class="card-main"><span class="stripe"></span><div class="card-copy"><div class="category">${i.label}</div><div class="change"><span class="old">${i.wrong}</span> → <span class="new">${i.right}</span></div><div class="explanation">${i.explanation}</div></div></div><div class="card-actions"><button class="accept" data-action="accept">Prihvati</button><button class="ignore" data-action="ignore">Zanemari</button></div></div>`).join(''):'<div class="empty"><strong>Tekst izgleda dobro.</strong>Nema prijedloga u ovoj kategoriji.</div>';document.getElementById('spell-count').textContent=visible.filter(i=>i.category==='spelling').length;document.getElementById('grammar-count').textContent=visible.filter(i=>i.category==='grammar').length;document.getElementById('style-count').textContent=visible.filter(i=>i.category==='style').length;stats()}
function notify(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function save(){localStorage.setItem('pravopis-draft',JSON.stringify({title:document.getElementById('title').value,text:editor.innerHTML,goal:document.getElementById('goal').value}));document.getElementById('status-save').textContent='Sve spremljeno'}
function apply(id){const issue=issueRules.find(i=>i.id===id);if(!issue)return;const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.nodeValue.includes(issue.wrong)){node.nodeValue=node.nodeValue.replace(issue.wrong,issue.right);break}}accepted.add(id);render();save();notify('Prijedlog prihvaćen')}
suggestions.addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;const id=card.dataset.id;if(e.target.dataset.action==='accept')apply(id);if(e.target.dataset.action==='ignore'){dismissed.add(id);render();notify('Prijedlog zanemaren')}});document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;render()}));document.querySelectorAll('[data-command]').forEach(btn=>btn.addEventListener('click',()=>document.execCommand(btn.dataset.command)));document.getElementById('undo').onclick=()=>document.execCommand('undo');document.getElementById('redo').onclick=()=>document.execCommand('redo');document.getElementById('clear').onclick=()=>{dismissed=new Set();accepted=new Set();render();notify('Prijedlozi su ponovno prikazani')};document.getElementById('accept-spelling').onclick=()=>issueRules.filter(i=>i.category==='spelling').forEach(i=>apply(i.id));document.getElementById('analyze').onclick=()=>{notify('Tekst je ponovno analiziran');render()};editor.addEventListener('input',()=>{document.getElementById('status-save').textContent='Spremanje…';stats();clearTimeout(window.saveTimer);window.saveTimer=setTimeout(()=>{save();render()},700)});document.getElementById('title').addEventListener('input',save);window.addEventListener('beforeunload',save);
const draft=localStorage.getItem('pravopis-draft');if(draft){try{const d=JSON.parse(draft);if(d.title)document.getElementById('title').value=d.title;if(d.text)editor.innerHTML=d.text;if(d.goal)document.getElementById('goal').value=d.goal}catch(e){}}render();
</script></body></html>
